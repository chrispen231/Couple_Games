<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Couple Games - Spark Your Connection</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Couple Games</h1>
            <p class="tagline">Spark Your Connection</p>
            <div class="mode-selector">
                <button id="normal-mode-btn" class="mode-btn active" onclick="setMode('normal')">Normal</button>
                <button id="funny-mode-btn" class="mode-btn" onclick="setMode('funny')">Funny</button>
                <button id="naughty-mode-btn" class="mode-btn" onclick="setMode('naughty')">Naughty</button>
                <button id="adult-mode-btn" class="mode-btn" onclick="setMode('adult')">18+</button>
            </div>
        </header>

        <main id="game-container">
            <!-- Menu View -->
            <section id="menu-view" class="view active">
                <div class="game-grid">
                    <button class="game-card" onclick="startGame('truth-or-dare')">
                        <div class="card-icon">🔥</div>
                        <h3>Truth or Dare</h3>
                        <p>Deep secrets or daring challenges.</p>
                    </button>
                    <button class="game-card" onclick="startGame('never-have-i-ever')">
                        <div class="card-icon">🥂</div>
                        <h3>Never Have I Ever</h3>
                        <p>Find out what they've really done.</p>
                    </button>
                    <button class="game-card" onclick="startGame('would-you-rather')">
                        <div class="card-icon">🤔</div>
                        <h3>Would You Rather</h3>
                        <p>Difficult choices, interesting talks.</p>
                    </button>
                    <button class="game-card" onclick="startGame('date-idea')">
                        <div class="card-icon">✨</div>
                        <h3>Date Generator</h3>
                        <p>Random ideas for your next date.</p>
                    </button>
                </div>
            </section>

            <!-- Game Play View -->
            <section id="play-view" class="view">
                <div class="game-header">
                    <button class="back-btn" onclick="showMenu()">← Back</button>
                    <h2 id="game-title">Game Title</h2>
                </div>
                <div id="card-display" class="card">
                    <p id="card-content">Click 'Next' to start!</p>
                </div>
                <div class="game-controls">
                    <button id="next-btn" class="primary-btn">Next</button>
                </div>
            </section>
        </main>

        <footer>
            <p>Made with ❤️ for Couples</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
